[project]
name = "agentnerf"
version = "0.1.0"
description = "Longitudinal multi-turn tool-use drift benchmark for frontier OpenAI and Anthropic models, traced end-to-end in CoreWeave Agent Lens."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.52.0",
  "coreweave>=0.1.0b0",
  "openai>=1.75.0",
  "wandb[eval-table]>=0.25.0",
]

[project.scripts]
agentnerf = "agentnerf.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentnerf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 104
target-version = "py312"
